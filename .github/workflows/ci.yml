name: Validate STEPLine EDU

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: API, permissions, content and client logic
        run: |
          node tests/experience.cjs
          node tests/content-integration.cjs
          node tests/offline-and-languages.cjs
          node tests/ticker-motion.cjs
          node tests/cloudflare-access.test.mjs
          node tests/cloudflare-config.test.mjs
          node tests/d1-file-storage.test.mjs
      - name: Build Worker and validate rendered HTML
        env:
          SITES_ENV_READY: '1'
          SITES_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          npm run build
          node tests/rendered-html.test.mjs
          node tests/cloudflare-worker.test.mjs
          node tests/d1-runtime.test.mjs
      - name: Validate standalone Cloudflare build without deployment
        env:
          CLOUDFLARE_D1_DATABASE_ID: '11111111-1111-4111-8111-111111111111'
          FILE_STORAGE: d1
          ACCESS_TEAM_DOMAIN: stepline-ci.cloudflareaccess.com
          ACCESS_AUD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          bash scripts/build-cloudflare.sh
          node tests/cloudflare-worker.test.mjs
