name: Deploy STEPLine EDU to Cloudflare

on:
  workflow_run:
    workflows: [Validate STEPLine EDU]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply migrations to a new empty D1 or a database with a verified backup
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      WRANGLER_LOG_PATH: .wrangler/wrangler.log
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify deployment targets current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate code and authorization
        run: |
          npx tsc --noEmit
          node tests/experience.cjs
          node tests/content-integration.cjs
          node tests/offline-and-languages.cjs
          node tests/ticker-motion.cjs
          node tests/cloudflare-access.test.mjs
          node tests/cloudflare-config.test.mjs
      - run: bash scripts/build-cloudflare.sh
      - name: Validate built Worker
        run: |
          node tests/rendered-html.test.mjs
          node tests/cloudflare-worker.test.mjs
      - name: Apply explicitly requested migrations
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node_modules/.bin/wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json </dev/null
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare
